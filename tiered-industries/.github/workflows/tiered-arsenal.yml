# Tiered Arsenal: builds the mod whenever anything in tiered-arsenal/ is pushed to main.
# When mod_version in tiered-arsenal/gradle.properties is new (no tag for it yet), it also publishes a GitHub
# Release named after the version, with that version's CHANGELOG section as the notes and the jar attached.
# Until the mod's source is in tiered-arsenal/ (no gradlew yet), it just skips.
name: Tiered Arsenal

on:
  push:
    branches: [ main ]
    paths: [ 'tiered-arsenal/**', '.github/workflows/tiered-arsenal.yml' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiered-arsenal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiered-arsenal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags, to see whether this version was already released

      - name: Is the source here yet?
        id: src
        run: |
          if [ -f gradlew ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "No source in tiered-arsenal/ yet - nothing to build."; fi

      - uses: actions/setup-java@v4
        if: steps.src.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.src.outputs.ok == 'true'

      - name: Build
        if: steps.src.outputs.ok == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Read version and release notes
        id: v
        if: steps.src.outputs.ok == 'true'
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r ')
          TAG="tieredarsenal-v$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          TITLE=$(grep -m1 "^## $VER" CHANGELOG.md 2>/dev/null | sed 's/^## //' | tr -d '\r')
          echo "title=${TITLE:-$VER}" >> "$GITHUB_OUTPUT"
          awk -v v="## $VER" 'index($0, v) == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > release-notes.md 2>/dev/null || echo "Tiered Arsenal $VER" > release-notes.md
          [ -s release-notes.md ] || echo "Tiered Arsenal $VER" > release-notes.md
          rm -f build/libs/*-sources.jar
          ls -l build/libs

      - name: Keep the jar with this run
        if: steps.src.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tieredarsenal-${{ steps.v.outputs.version }}
          path: tiered-arsenal/build/libs/*.jar

      - name: Publish the release (new versions only)
        if: steps.src.outputs.ok == 'true' && steps.v.outputs.new == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Tiered Arsenal ${{ steps.v.outputs.title }}
          body_path: tiered-arsenal/release-notes.md
          files: tiered-arsenal/build/libs/*.jar
          make_latest: false   # "Latest" stays on Tiered Industries; each mod's newest release is still at the top of its own tag list
