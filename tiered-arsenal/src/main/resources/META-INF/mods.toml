displayName="Tiered Arsenal"
authors="BobRoflza"
description='''
Weapons, armour and tools companion to Tiered Industries.
Six tiers from Copper to Aetherium, four new ores, a smithing upgrade chain, greatswords, daggers, spears,
war hammers, bows, crossbows and shields, gear modules fitted at the Armoury Workbench, enchantments,
armour trims, a quiver and tool belt, and the Aetherium Guardian boss.
Works on its own; with Tiered Industries the top tiers go through its machines.
'''

